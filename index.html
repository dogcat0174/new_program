<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>전자 서명 작성</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="background-shape shape-1"></div>
    <div class="background-shape shape-2"></div>

    <div class="container">
        <header>
            <h1>서명 등록 시스템</h1>
            <p>자신의 연수와 부서를 선택한 뒤 서명해주세요.</p>
        </header>
        
        <!-- 데이터 로딩 중 표시 -->
        <div id="initialLoader" class="initial-loader">
            <div class="loader-circle"></div>
            <p>서버에서 연수 및 부서 정보를 불러오는 중...</p>
        </div>

        <form id="signatureForm" class="hidden">
            <div class="input-group">
                <label for="trainingList">연수 명칭</label>
                <select id="trainingList" name="trainingList" required>
                    <option value="" disabled selected>참여하는 연수를 선택하세요</option>
                </select>
            </div>

            <!-- 연수 주제 표시 영역 -->
            <div id="topicDisplay" class="topic-box hidden">
                <strong>연수 주제</strong>
                <p id="topicText"></p>
            </div>

            <div class="input-group">
                <label for="department">소속 부서</label>
                <select id="department" name="department" required>
                    <option value="" disabled selected>부서를 선택하세요</option>
                </select>
            </div>

            <div class="input-group">
                <label for="name">성명</label>
                <input type="text" id="name" name="name" placeholder="홍길동" required autocomplete="off">
            </div>

            <div class="input-group canvas-group">
                <div class="canvas-header">
                    <label>서명 (Signature)</label>
                    <button type="button" id="clearBtn" class="clear-btn">지우기 ↺</button>
                </div>
                <div class="canvas-wrapper">
                    <canvas id="signaturePad" width="500" height="200"></canvas>
                </div>
            </div>

            <div class="action-group">
                <button type="submit" id="submitBtn" class="submit-btn" disabled>
                    <span class="btn-text">저장하기</span>
                    <span class="loader hidden"></span>
                </button>
            </div>
        </form>

        <div id="statusMessage" class="hidden"></div>
    </div>

    <!-- 스크립트 연결 -->
    <script src="app.js"></script>
</body>
</html>
